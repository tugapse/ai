services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    image: jarvis-ai:latest
    container_name: jarvis-ai
    command: ["--server"]
    ports:
      - "9999:9999"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      # Pass the same variable value into the container's environment:
      - AI_ASSISTANT_DIRECTORY=${AI_ASSISTANT_DIRECTORY}
      - TQDM_DISABLE=1
    volumes:
      # Mount host path directly to the identical path inside the container:
      - ${AI_ASSISTANT_DIRECTORY}:${AI_ASSISTANT_DIRECTORY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9999/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - jarvis-network

networks:
  jarvis-network:
    driver: bridge