site_name: AI Assistant CLI
theme:
  name: material
  palette:
    scheme: slate # Dark mode by default
    primary: deep purple
  features:
    - navigation.tabs
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src] # Tells it to look in the current directory for modules

nav:
  - Home: index.md
  - CLI Usage: cli_usage.md # You can move your previous CLI doc here
  - Code Reference:
      - Main Logic: reference/main.md
      - CLI Parsing: reference/cli_args.md